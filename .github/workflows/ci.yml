name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Syntax and JSON
        run: |
          python -m py_compile scripts/server.py scripts/uploader_core.py
          python -m json.tool .codex-plugin/plugin.json >/dev/null
          python -m json.tool .mcp.json >/dev/null
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
      - name: Tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
